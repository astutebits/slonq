[package]
name = "slonq-js"
version = "0.0.0"
edition = "2024"
license = "MIT"

[lib]
name = "slonq_js"
crate-type = ["cdylib"]

[dependencies]
neon = { version = "1.1", default-features = false, features = ["napi-8"] }
slonq = { path = "../slonq-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = "1"
