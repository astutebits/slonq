[package]
name = "slonq"
version = "0.0.0"
edition = "2024"
description = "A reliable, lightweight PostgreSQL job queue for Rust. Uses FOR UPDATE SKIP LOCKED for atomic, concurrent task distribution without external dependencies."
license = "MIT"

exclude = [
  ".gitignore",
  ".github",
  "README.md"
]

[dependencies]

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

tokio-postgres = { version = "0.7", features = [
  "with-uuid-1",
  "with-serde_json-1",
  "with-chrono-0_4",
] }

postgres-types = { version = "0.2", features = ["derive"] }

serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }


[dev-dependencies]
stateright = "0.31"
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }