[package]
name = "slonq-python"
version = "0.0.0"
edition = "2024"

[lib]
name = "slonq"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.27.0", features = ["tokio-runtime"] }
slonq = { path = "../slonq-core" }
serde_json = "1"