[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "slonq"
description = "A reliable, lightweight PostgreSQL job queue. Uses FOR UPDATE SKIP LOCKED for atomic, concurrent task distribution without external dependencies."
requires-python = ">=3.11"
authors = [
  { name = "Borislav Borisov", email = "chmodas@astutebits.com" }
]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
profile = "release"
editable-profile = "release"
manifest-path = "Cargo.toml"
frozen = false
locked = false

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.9.0",
    "asyncpg>=0.30.0",
    "maturin>=1.11.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
